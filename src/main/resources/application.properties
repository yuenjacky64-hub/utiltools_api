spring.application.name=utiltools-api
server.port=8080
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# Audit journal
utiltools.audit.max-entries=200
utiltools.audit.max-replay-bytes=65536
# PENDING entries older than this are reaped to FAILED/STALE_PENDING_REAPED.
utiltools.audit.stale-pending-seconds=300
# Fixed delay between scheduled journal reaper passes, in milliseconds. One pass rolls back
# expired replay claims, fails stale PENDING entries and reclaims oversize non-replayable entries.
utiltools.audit.cleanup-interval-ms=60000
# Lease a replay claim holds on an entry; an expired IN_PROGRESS claim may be taken over.
utiltools.audit.replay-lease-seconds=30

# ---- Rate limiting (/api/v1/utils/*) ----
# Master switch: false lets every request through untouched (no headers, never 429).
utiltools.ratelimit.enabled=true
# Admitted requests allowed per client in any trailing window.
utiltools.ratelimit.requests-per-window=60
# Sliding window length in milliseconds.
utiltools.ratelimit.window-ms=60000
# Fixed delay between scheduled idle-bucket cleanup passes, in milliseconds.
utiltools.ratelimit.cleanup-interval-ms=30000
# Hard cap on tracked client keys (bounds limiter memory).
utiltools.ratelimit.max-tracked-clients=10000
# Trust the first well-formed X-Forwarded-For entry; keep false unless a trusted proxy sets it.
utiltools.ratelimit.trust-forwarded-header=false
# Weighted admission cost per route, in the same unit as requests-per-window. Every value must be
# >= 1; a non-positive value fails startup. Routes without a specific entry cost the default.
utiltools.ratelimit.costs.default=1
# POST /api/v1/utils/audit/verify (replays up to the journal cap).
utiltools.ratelimit.costs.audit-verify=5
# POST /api/v1/utils/jobs/hash (hashes up to 1000 items).
utiltools.ratelimit.costs.job-submit=3
# POST /api/v1/utils/json/query (evaluates an arbitrary JSONPath).
utiltools.ratelimit.costs.json-query=2

# Batch hash jobs (bounded async execution)
utiltools.jobs.worker-count=2
utiltools.jobs.queue-capacity=100
utiltools.jobs.retention-seconds=300
utiltools.jobs.cleanup-interval-ms=60000
# Bounded FAILED -> QUEUED retries per job (a first submission is attempt 1); clamped to >= 1.
utiltools.jobs.max-attempts=3
# Lease a RUNNING hash-job attempt holds; the worker renews it before hashing each item.
utiltools.jobs.execution-lease-seconds=30
# Fixed delay between scheduled stale-RUNNING reaper passes, in milliseconds.
utiltools.jobs.execution-reaper-interval-ms=5000
# Grace window (seconds) the @PreDestroy drain waits for in-flight batch hash work before
# forcing interruption and failing the remainder with JOB_SHUTDOWN. Must not be negative; 0 = no grace.
utiltools.jobs.shutdown-grace-seconds=30
# Per-client admission quota over non-terminal (QUEUED or RUNNING) jobs; must be positive.
utiltools.jobs.max-active-jobs-per-client=20
# Server default total-life bound (seconds) applied when a request omits deadlineSeconds: it covers
# queue wait plus execution and fails the job with JOB_DEADLINE_EXCEEDED, keeping the checkpoint prefix
# for a retry. 0 disables the default; anything outside 0..3600 is rejected at startup.
utiltools.jobs.default-deadline-seconds=0
# Hard cap on retained terminal (COMPLETED/FAILED/CANCELLED) job rows; must be positive.
# Older terminal rows are evicted once the cap is exceeded; non-terminal rows are never evicted.
utiltools.jobs.max-retained-jobs=1000

# ---- Circuit breaker (/api/v1/utils/resilience) ----
# A HALF_OPEN probe holds a lease; while it is live a concurrent caller fast-fails 503 CIRCUIT_OPEN.
utiltools.resilience.probe-lease-seconds=10
# Fixed delay between scheduled sweeps that release expired probe leases, in milliseconds.
utiltools.resilience.probe-reaper-interval-ms=5000
