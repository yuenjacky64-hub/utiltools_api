spring.application.name=utiltools-api
server.port=8080
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# ---- Rate limiting (/api/v1/utils/*) ----
# Master switch: false lets every request through untouched (no headers, never 429).
utiltools.ratelimit.enabled=true
# Admitted requests allowed per client in any trailing window.
utiltools.ratelimit.requests-per-window=60
# Sliding window length in milliseconds.
utiltools.ratelimit.window-ms=60000
# Fixed delay between scheduled idle-bucket cleanup passes, in milliseconds.
utiltools.ratelimit.cleanup-interval-ms=30000
# Hard cap on tracked client keys (bounds limiter memory).
utiltools.ratelimit.max-tracked-clients=10000
# Trust the first well-formed X-Forwarded-For entry; keep false unless a trusted proxy sets it.
utiltools.ratelimit.trust-forwarded-header=false
