name: Auto Merge and Delete Branch

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Wait for GitHub to calculate mergeability
        id: wait
        uses: actions/github-script@v6
        with:
          script: |
            // `core` is provided by actions/github-script
            const prNumber = context.payload.pull_request.number;
            // GitHub calculates `mergeable` asynchronously — poll a few times
            let pr;
            for (let i = 0; i < 10; i++) {
              pr = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber });
              if (pr.data.mergeable !== null) break;
              await new Promise(r => setTimeout(r, 2000));
            }
            core.setOutput('mergeable', String(pr.data.mergeable));
            core.setOutput('mergeable_state', pr.data.mergeable_state || 'unknown');

      - name: Merge pull request
        id: merge
        if: steps.wait.outputs.mergeable == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            // `core` is provided by actions/github-script
            const prNumber = context.payload.pull_request.number;
            const res = await github.rest.pulls.merge({ owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber, merge_method: 'squash' });
            core.setOutput('merged', res.data.merged ? 'true' : 'false');

      - name: Skip merge (unmergeable)
        if: steps.wait.outputs.mergeable != 'true'
        run: |
          echo "Pull request is not mergeable right now (state=${{ steps.wait.outputs.mergeable_state }}). Skipping auto-merge."

      - name: Delete feature branch
        if: steps.merge.outputs.merged == 'true'
        id: delete
        uses: actions/github-script@v6
        with:
          script: |
            // `core` is provided by actions/github-script
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const headRepoFullName = pr.head.repo.full_name;
            const currentRepoFullName = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepoFullName !== currentRepoFullName) {
              console.log('Branch is from a fork; will not delete remote branch.');
              core.setOutput('deleted', 'false');
              return;
            }
            const baseRef = pr.base.ref;
            if (headRef === baseRef) {
              console.log('Head branch equals base branch; refusing to delete.');
              core.setOutput('deleted', 'false');
              return;
            }
            await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${headRef}` });
            core.setOutput('deleted', 'true');

      - name: Report deletion
        if: steps.delete.outputs.deleted == 'true'
        run: echo "Deleted branch ${{ github.event.pull_request.head.ref }}"
